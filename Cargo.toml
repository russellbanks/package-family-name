[package]
name = "package-family-name"
version = "3.0.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
categories = ["no-std"]
description = "Library for calculating MSIX Package Family Name values."
documentation = "https://docs.rs/package-family-name"
readme = "README.md"
repository = "https://github.com/russellbanks/package-family-name"

[dependencies]
serde_core = { version = "1", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false }
thiserror = { version = "2", default-features = false }

[features]
serde = ["dep:serde_core"]

[dev-dependencies]
rustc-hash = { version = "2", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
